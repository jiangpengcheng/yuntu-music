name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Sign and publish APK
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;33.0.2'
      - name: Restore private signing material
        env:
          RELEASE_KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_B64" && test -n "$RELEASE_PASSWORD"
          umask 077
          mkdir -p android/.signing
          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > android/.signing/yuntu.jks
          printf '%s' "$RELEASE_PASSWORD" > android/.signing/password.txt
      - name: Build and verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build_android.py --release
          python3 scripts/prepare_release.py --tag "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
      - name: Create Release with APK and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --verify-tag --draft --title "云途音乐 $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove private signing files
        if: always()
        run: rm -rf android/.signing
